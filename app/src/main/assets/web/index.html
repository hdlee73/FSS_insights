<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FSS Insights</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* 앱 안에 내장된 화면: 왼쪽 메뉴·뒤로가기는 앱이 맡고, 여기서는 제목줄과 본문만 그린다. */
    html, body { height: 100%; }
    body { display: block; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    .main { height: 100%; }
    .top .hamb { display: none !important; }
    .top { padding-top: 8px; padding-bottom: 8px; }
    .content { padding: 14px 14px 28px; overscroll-behavior: contain; display: flex; flex-direction: column; min-height: 0; }
    .content > .screen { width: 100%; }
    /* 3단 워크벤치(제재 양정)는 본문 전체를 쓴다. 퍼센트 높이 대신 flex로 높이를 받아 WebView에서도 0이 되지 않게 한다. */
    .content[data-route="finsim"] { padding: 0; overflow: hidden; }
    .content[data-route="finsim"] > .screen { flex: 1 1 auto; min-height: 0; height: auto; max-width: none; display: flex; flex-direction: column; }
    .content[data-route="finsim"] .fs { flex: 1 1 auto; min-height: 0; height: auto; }
  </style>
  <script type="module" src="js/app.js"></script>
</head>
<body class="embedded">
  <main class="main">
    <header class="top">
      <div class="top-t"><h1 id="title">FSS Insights</h1><div id="sub" class="sub"></div></div>
      <div id="top-actions" class="top-acts"></div>
    </header>
    <div id="content" class="content"><div class="state"><div class="spin"></div></div></div>
  </main>
  <noscript><p style="padding:24px">자바스크립트가 필요합니다.</p></noscript>
</body>
</html>
