name: Consumer data

# 금감원 '분쟁조정결정례'(1999년~)와 '분쟁조정사례'를 모아 disputes.json으로 정리해 consumer-data 브랜치에 올린다.
# 웹·앱의 '금융소비자 지킴이 > 분쟁조정 사례 검색'이 이 파일을 읽는다. 처음 한 번은 첨부 1,000여 개를 받느라 10분쯤,
# 그 뒤로는 새 글만 읽는다. 첨부는 모두 공개 게시판 파일이며 당사자는 원문에서 이미 가명 처리돼 있다.
on:
  schedule:
    - cron: "30 21 * * *" # 매일 06:30(한국시각)
  workflow_dispatch:
    inputs:
      reparse:
        description: "이전 자료를 버리고 전부 다시 읽기"
        type: boolean
        default: false
  pull_request:
    paths:
      - "server/consumer-data/**"
      - "server/sanction-data/hwp_text.py"
      - "server/sanction-data/extract_text.py"
      - ".github/workflows/consumer-data.yml"

permissions:
  contents: write

concurrency:
  group: consumer-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet olefile==0.47 pypdfium2 pdfminer.six pillow pycryptodome
      - name: Get previous data
        run: |
          if git fetch --depth=1 origin consumer-data 2>/dev/null; then
            git show FETCH_HEAD:disputes.json > prev.json || true
          fi
          ls -la prev.json 2>/dev/null || echo "이전 자료 없음(처음 실행)"
      - name: Restore attachment cache
        uses: actions/cache/restore@v4
        with:
          path: dispute-cache
          key: dispute-files-${{ github.run_id }}
          restore-keys: dispute-files-
      - name: Build disputes.json
        run: |
          ARGS="--prev prev.json --cache dispute-cache --workers 4"
          if [ "${{ inputs.reparse }}" = "true" ]; then ARGS="$ARGS --reparse"; fi
          python3 server/consumer-data/build_disputes.py disputes.json $ARGS
          python3 - <<'PY'
          import json, collections
          d = json.load(open('disputes.json')); it = d['items']
          print(d['counts'])
          assert len(it) > 900, 'too few items'
          print(collections.Counter(x.get('result') or '-' for x in it))
          PY
      - name: Save attachment cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dispute-cache
          key: dispute-files-${{ github.run_id }}
      - name: Upload for review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: disputes-json
          path: disputes.json
      - name: Publish to consumer-data branch
        # PR에서는 검토용 산출물만 올리고, 웹·앱이 읽는 consumer-data 브랜치는 병합 뒤 정기·수동 실행에서만 갱신한다.
        if: github.event_name != 'pull_request'
        run: |
          mkdir publish && cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          cp ../disputes.json .
          cat > README.md <<'EOF'
          # FSS Insights 분쟁조정 자료

          금융감독원 '분쟁조정결정례'·'분쟁조정사례' 게시판을 GitHub Actions(.github/workflows/consumer-data.yml)가
          자동으로 모아 요약·정리한 파일입니다. 참고용이며 원문과 다를 수 있습니다. 이 브랜치는 매번 새로 덮어씁니다.
          EOF
          git add disputes.json README.md
          git commit -q -m "분쟁조정 자료 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:consumer-data
          echo "disputes.json $(du -h disputes.json | cut -f1) 게시" >> "$GITHUB_STEP_SUMMARY"
