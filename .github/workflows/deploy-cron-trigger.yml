name: Deploy cron trigger

# 커뮤니티 핫이슈 수집을 정시에 실행시키는 Cloudflare 타이머 Worker(server/cron-trigger)를 배포한다. 수동 실행 전용.
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID(기존), CRON_GH_TOKEN(새로 등록)
on:
  workflow_dispatch:
  # 임시: 병합 전 PR 브랜치에서 배포하기 위한 푸시 트리거(워크플로가 기본 브랜치에 없으면 수동 실행이 안 된다). 병합 전에 제거한다.
  push:
    branches: [claude/project-thread-bewdkx]
    paths:
      - ".github/workflows/deploy-cron-trigger.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/cron-trigger
          secrets: |
            GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.CRON_GH_TOKEN }}
