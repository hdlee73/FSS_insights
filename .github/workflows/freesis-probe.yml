name: freesis-probe
on:
  push:
    branches: [claude/freesis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: capture
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > cap.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ locale: 'ko-KR' });
            p.on('response', async r => {
              const u = r.url();
              if (/\/meta\/|\.do/.test(u)) {
                let body = ''; try { body = (await r.text()).slice(0, 1500); } catch (e) {}
                const req = r.request();
                console.log('>>', req.method(), u, r.status(), '\nREQ:', (req.postData() || '').slice(0, 1200), '\nRES:', body, '\n');
              }
            });
            await p.goto('https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS40200000000000&serviceId=STATFND0200100130', { waitUntil: 'networkidle', timeout: 60000 });
            await p.waitForTimeout(8000);
            console.log('TEXT:', (await p.innerText('body')).slice(0, 1500));
            await b.close();
          })();
          JS
          node cap.js 2>&1 | head -c 12000
