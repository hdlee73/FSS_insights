name: freesis-probe
on:
  push:
    branches: [claude/freesis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          B=https://freesis.kofia.or.kr
          curl -sSL -m 30 -A "$UA" -o main.js "$B/ui/app/com/main/Main.clx.js"
          echo "== main.js: srv/service refs"; grep -oE '.{0,200}(getSrvData|getMenuData|serviceId).{0,300}' main.js | head -8
          echo "== menu call"
          curl -sS -m 30 -A "$UA" -X POST -H "Content-Type: application/json" -H "X-Requested-With: XMLHttpRequest" -d '{"dmSearch":{"serviceId":"STATFND0200100130"}}' -w "\nHTTP %{http_code}\n" "$B/meta/getMenuData.do" | head -c 1500
          echo; echo "== srv call"
          curl -sS -m 30 -A "$UA" -X POST -H "Content-Type: application/json" -H "X-Requested-With: XMLHttpRequest" -d '{"dmSearch":{"serviceId":"STATFND0200100130"}}' -w "\nHTTP %{http_code}\n" "$B/meta/getSrvData.do" | head -c 1500
