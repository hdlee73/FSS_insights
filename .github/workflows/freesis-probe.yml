name: freesis-probe
on:
  push:
    branches: [claude/fund-aum-shot]
    paths: [".github/workflows/freesis-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          cat > p.py <<'PY'
          import json, subprocess
          REF = "https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS40200000000000&serviceId=STATFND0200100010"
          def post(body):
              for i in range(6):
                  p = subprocess.run(["curl", "-sS", "--compressed", "-m", "90", "-A", "Mozilla/5.0 Chrome/124", "-H", "Content-Type: application/json; charset=UTF-8", "-e", REF, "-d", json.dumps({"dmSearch": body}), "https://freesis.kofia.or.kr/meta/getMetaDataList.do"], capture_output=True)
                  try: return json.loads(p.stdout.decode("utf-8", "replace"), strict=False)
                  except Exception: pass
              return {}
          base = {"tmpV40": "100000000", "tmpV41": "1", "tmpV34": "20261105", "tmpV6": "2", "tmpV4": "", "tmpV5": "", "tmpV7": "2", "tmpV20": "Y", "OBJ_NM": "STATFND0200100010BO"}
          d = post(base)
          print("HEADER", json.dumps(d.get("dsmHeader"), ensure_ascii=False)[:3000])
          rows = d.get("ds1", [])
          bad = 0
          for r in rows:
              v = lambda i: r.get(f"TMPV{i}") or 0
              if sum(v(i) for i in range(2, 14)) != v(14): bad += 1
          print("SUM2-13 != TMPV14 rows:", bad, "of", len(rows))
          for col in (13, 18, 19, 15, 16, 17):
              hits = [(r["TMPV1"], r.get(f"TMPV{col}")) for r in rows if (r.get(f"TMPV{col}") or 0) > 0]
              print("COL", col, len(hits), hits[:8])
          for r in rows:
              if (r.get("TMPV13") or 0) > 0: print("T13", r["TMPV1"], [r.get(f"TMPV{i}") for i in range(2, 21)]); break
          PY
          python3 p.py
