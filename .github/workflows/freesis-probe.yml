name: freesis-probe
on:
  push:
    branches: [claude/freesis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          cat > p.py <<'PY'
          import json, subprocess
          B = "https://freesis.kofia.or.kr/meta/"
          REF = "https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS40200000000000&serviceId=STATFND0200100130"
          def post(ep, body):
              for i in range(6):
                  p = subprocess.run(["curl", "-sS", "--compressed", "-m", "90", "-A", "Mozilla/5.0 Chrome/124", "-H", "Content-Type: application/json; charset=UTF-8", "-e", REF, "-d", json.dumps(body), B + ep], capture_output=True)
                  try: return json.loads(p.stdout.decode("utf-8", "replace"), strict=False)
                  except Exception as e: print("retry", i, len(p.stdout), p.stderr[:100])
              return {}
          d = post("getSrvData.do", {"dmSearchData": {"strSvrId": "STATFND0200100130", "strDivId": "MSIS40000000000000", "app_peron_yn": "Y", "language_gb": "KOR", "strGetCode": "Y"}})
          for r in d.get("dsSearch", []):
              print("COND", r.get("INPUT_SEQ"), r.get("CONDITION_NM"), r.get("SRCH_METAVAR"), r.get("ITEM_DMNID"), r.get("D_DISPLAY_DSPVLU"), r.get("PARENT_CONDID"))
          seen = set()
          for r in d.get("dsSearchCd", []) + d.get("dsSearchCdList", []):
              g = r.get("GROUP_CD")
              if g in ("C0221", "C4024", "C4052", "C4053", "T2050", "T1100", "T3017", "T4005", "T4035", "T3014", "T3045", "T3076", "YN001"): continue
              print("CD", g, r.get("COMMON_CD"), r.get("CODE_NM"))
          for h in d.get("dsGrid", []):
              print("HDR", h.get("HEADER_ID"), h.get("HEADER_NM"), h.get("PARENT_HEADERID") or h.get("PARENT_ID"), h.get("COLUMN_ID") or h.get("DATA_ID") or "")
          PY
          python3 p.py 2>&1 | cut -c1-200
