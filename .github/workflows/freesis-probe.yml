name: freesis-probe
on:
  push:
    branches: [claude/freesis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: capture
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > cap.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ locale: 'ko-KR' });
            p.on('response', async r => {
              const req = r.request();
              if (req.method() !== 'POST') return;
              let body = ''; try { body = (await r.text()).slice(0, 700); } catch (e) {}
              console.log('>>POST', r.url(), r.status(), '\nREQ:', (req.postData() || '').slice(0, 600), '\nRES:', body.replace(/\s+/g,' '), '\n');
            });
            await p.goto('https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS40200000000000&serviceId=STATFND0200100130', { waitUntil: 'networkidle', timeout: 60000 });
            await p.waitForTimeout(5000);
            console.log('=== CLICK 공모 + 조회');
            await p.getByText('공모', { exact: true }).first().click().catch(e => console.log('click1', e.message));
            await p.getByText('조회', { exact: true }).first().click().catch(e => console.log('click2', e.message));
            await p.waitForTimeout(8000);
            await b.close();
          })();
          JS
          node cap.js 2>&1 | head -c 20000
