name: freesis-probe
on:
  push:
    branches: [claude/freesis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: capture
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > cap.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ locale: 'ko-KR', viewport: { width: 1400, height: 900 } });
            p.on('request', r => { if (r.url().includes('getMetaDataList')) console.log('REQ', r.postData()); });
            await p.goto('https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS40200000000000&serviceId=STATFND0200100130', { waitUntil: 'networkidle', timeout: 60000 });
            await p.waitForTimeout(6000);
            const info = await p.evaluate(() => [...document.querySelectorAll('*')].filter(e => e.children.length === 0 && ['공모', '사모', '조회'].includes((e.textContent || '').trim())).map(e => e.tagName + '.' + e.className + ' ' + (e.textContent || '').trim() + ' ' + JSON.stringify(e.getBoundingClientRect())));
            console.log('FOUND', JSON.stringify(info, null, 1));
            console.log('FRAMES', p.frames().map(f => f.url()).join(' | '));
            const radios = await p.evaluate(() => [...document.querySelectorAll('input[type=radio], [role=radio]')].map(e => (e.name || e.id || e.className) + '=' + (e.value || e.getAttribute('aria-label') || '') + ' checked=' + e.checked + ' ' + JSON.stringify(e.getBoundingClientRect())));
            console.log('RADIOS', radios.join('\n'));
            await b.close();
          })();
          JS
          node cap.js 2>&1 | cut -c1-400 | head -80
