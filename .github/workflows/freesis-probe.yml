name: freesis-probe
on:
  push:
    branches: [claude/fund-aum-shot]
    paths: [".github/workflows/freesis-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          cat > p.py <<'PY'
          import json, subprocess
          REF = "https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS40200000000000&serviceId=STATFND0200100010"
          def post(body):
              for i in range(6):
                  p = subprocess.run(["curl", "-sS", "--compressed", "-m", "90", "-A", "Mozilla/5.0 Chrome/124", "-H", "Content-Type: application/json; charset=UTF-8", "-e", REF, "-d", json.dumps({"dmSearch": body}), "https://freesis.kofia.or.kr/meta/getMetaDataList.do"], capture_output=True)
                  try: return json.loads(p.stdout.decode("utf-8", "replace"), strict=False)
                  except Exception: pass
              return {}
          base = {"tmpV40": "100000000", "tmpV41": "1", "tmpV34": "20261105", "tmpV6": "2", "tmpV4": "", "tmpV5": "", "tmpV7": "2", "tmpV20": "Y", "OBJ_NM": "STATFND0200100010BO"}
          d = post(base)
          print("HEADER", json.dumps(d.get("dsmHeader"), ensure_ascii=False)[:3000])
          import itertools
          rows = [r for r in d.get("ds1", []) if "소계" not in r["TMPV1"]]
          cols = list(range(2, 14)) + [18]
          V = lambda r, i: r.get(f"TMPV{i}") or 0
          best = []
          for mask in range(1 << len(cols)):
              sel = [c for k, c in enumerate(cols) if mask >> k & 1]
              ok = sum(1 for r in rows if sum(V(r, c) for c in sel) == V(r, 14))
              best.append((ok, sel))
          best.sort(key=lambda x: -x[0])
          print("ROWS", len(rows))
          for ok, sel in best[:6]: print("SUBSET", ok, sel)
          tot = [r for r in d.get("ds1", []) if r["TMPV1"] == "합계"]
          print("TOTALROW", [[r.get(f"TMPV{i}") for i in range(2, 21)] for r in tot])
          for r in rows[:0]: pass
          for nm in ("미래에셋자산운용", "교보에이아이엠자산운용", "차파트너스자산운용"):
              for r in rows:
                  if r["TMPV1"] == nm: print("ROW", nm, [r.get(f"TMPV{i}") for i in range(2, 21)])
          print("KEYS", list(d.keys()))
          PY
          python3 p.py
