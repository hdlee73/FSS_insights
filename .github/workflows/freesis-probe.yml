name: freesis-probe
on:
  push:
    branches: [claude/freesis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          cat > p.py <<'PY'
          import json, subprocess
          B = "https://freesis.kofia.or.kr/meta/"
          REF = "https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS40200000000000&serviceId=STATFND0200100130"
          def post(ep, body):
              for i in range(6):
                  p = subprocess.run(["curl", "-sS", "--compressed", "-m", "90", "-A", "Mozilla/5.0 Chrome/124", "-H", "Content-Type: application/json; charset=UTF-8", "-e", REF, "-d", json.dumps(body), B + ep], capture_output=True)
                  try: return json.loads(p.stdout.decode("utf-8", "replace"), strict=False)
                  except Exception as e: print("retry", i, len(p.stdout), p.stderr[:100])
              return {}
          def q(**kw):
              b = {"tmpV40": "100000000", "tmpV41": "1", "tmpV34": "20261105", "tmpV100": "2", "tmpV102": "", "tmpV5": "", "tmpV20": "Y", "OBJ_NM": "STATFND0200100130BO"}
              b.update(kw)
              d = post("getMetaDataList.do", {"dmSearch": b})
              rows = d.get("ds1", [])
              g = [r for r in rows if r.get("TMPV1", "").startswith("골든브릿지")]
              tot = sum((r.get("TMPV15") or 0) for r in rows)
              print(kw, "rows", len(rows), "합계합", tot, "골든", [g[0].get(f"TMPV{i}") for i in range(2, 21)] if g else None)
          for v in ["1", "2", "3", "4"]: q(tmpV41=v)
          q(tmpV41="2", tmpV102="*")
          q(tmpV41="2", tmpV34="20260930")
          q(tmpV41="2", tmpV34="20251231")
          PY
          python3 p.py 2>&1 | cut -c1-200
