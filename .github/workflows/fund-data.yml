name: Fund data

# 금융투자협회 종합통계 포털(FreeSIS) '회사별설정규모'에서 운용사·증권사별 펀드 순자산총액(공모/사모)을 모아
# fund-aum.json을 fund-data 브랜치에 올린다. 앱·웹은 이 파일만 받는다. 요청은 하루 6건뿐이다.

on:
  schedule:
    - cron: "30 22 * * *" # 매일 07:30(한국시각)
  workflow_dispatch:
  pull_request:
    paths:
      - "server/fund-data/**"
      - ".github/workflows/fund-data.yml"

permissions:
  contents: write

concurrency:
  group: fund-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build fund-aum.json
        run: python3 server/fund-data/build_fund_aum.py fund-aum.json
      - name: Publish to fund-data branch
        run: |
          mkdir publish && cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          cp ../fund-aum.json .
          cat > README.md <<'EOT'
          # FSS Insights 펀드 순자산 자료

          금융투자협회 종합통계 포털(FreeSIS) '회사별설정규모'를 GitHub Actions(.github/workflows/fund-data.yml)가
          매일 모아 정리한 파일입니다. 참고용이며 원문과 다를 수 있습니다. 이 브랜치는 매번 새로 덮어씁니다.
          EOT
          git add fund-aum.json README.md
          git commit -q -m "펀드 순자산 자료 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:fund-data
          echo "fund-aum.json $(du -h fund-aum.json | cut -f1) 게시" >> "$GITHUB_STEP_SUMMARY"
