name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build installable APK
        run: ./gradlew assembleRelease
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk finance-news-radar-v0.2.0.apk
          sha256sum finance-news-radar-v0.2.0.apk > finance-news-radar-v0.2.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: finance-news-radar-apk
          path: |
            finance-news-radar-v0.2.0.apk
            finance-news-radar-v0.2.0.apk.sha256
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release edit v0.2.0 --notes-file RELEASE_NOTES.md
            gh release upload v0.2.0 \
              finance-news-radar-v0.2.0.apk \
              finance-news-radar-v0.2.0.apk.sha256 \
              --clobber
          else
            gh release create v0.2.0 \
              finance-news-radar-v0.2.0.apk \
              finance-news-radar-v0.2.0.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "금융뉴스 레이더 v0.2.0" \
              --notes-file RELEASE_NOTES.md
          fi
