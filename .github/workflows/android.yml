name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests and instrumentation build
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify PDF rendering and sharing on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-device-test-report
          path: app/build/reports/androidTests/
  build:
    needs: pdf-device-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build installable APK
        run: ./gradlew assembleRelease
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk finance-news-radar-v0.4.0.apk
          sha256sum finance-news-radar-v0.4.0.apk > finance-news-radar-v0.4.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: finance-news-radar-apk
          path: |
            finance-news-radar-v0.4.0.apk
            finance-news-radar-v0.4.0.apk.sha256
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release edit v0.4.0 --notes-file RELEASE_NOTES.md
            gh release upload v0.4.0 \
              finance-news-radar-v0.4.0.apk \
              finance-news-radar-v0.4.0.apk.sha256 \
              --clobber
          else
            gh release create v0.4.0 \
              finance-news-radar-v0.4.0.apk \
              finance-news-radar-v0.4.0.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "뉴스 및 연구자료 검색 v0.4.0" \
              --notes-file RELEASE_NOTES.md
          fi

