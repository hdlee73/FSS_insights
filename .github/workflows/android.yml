name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests and instrumentation build
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebugAndroidTest 2>&1 | tee build.log || {
            grep -E '^e: |FAILED|What went wrong|Test.*>' -A2 build.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify PDF rendering and sharing on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-device-test-report
          path: app/build/reports/androidTests/
  build:
    needs: pdf-device-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build installable APK
        env:
          NEWS_PROXY_URL: ${{ vars.NEWS_PROXY_URL }}
          NEWS_PROXY_TOKEN: ${{ secrets.NEWS_PROXY_TOKEN }}
        run: ./gradlew assembleRelease
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk fss-insights-v0.12.0.apk
          sha256sum fss-insights-v0.12.0.apk > fss-insights-v0.12.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fss-insights-apk
          path: |
            fss-insights-v0.12.0.apk
            fss-insights-v0.12.0.apk.sha256
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.12.0 >/dev/null 2>&1; then
            gh release edit v0.12.0 --notes-file RELEASE_NOTES.md
            gh release upload v0.12.0 \
              fss-insights-v0.12.0.apk \
              fss-insights-v0.12.0.apk.sha256 \
              --clobber
          else
            gh release create v0.12.0 \
              fss-insights-v0.12.0.apk \
              fss-insights-v0.12.0.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "FSS Insights v0.12.0" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Publish test build (pre-release, not a version release)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create test-build \
            fss-insights-v0.12.0.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "테스트 빌드 (정식 릴리스 아님)" \
            --notes "브랜치 ${GITHUB_REF_NAME} 의 테스트용 APK입니다. 기존 앱 위에 설치하면 업데이트됩니다."
