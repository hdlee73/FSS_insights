name: Deploy news proxy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DART company map
        # DART_API_KEY가 있으면 금융회사 이름 → DART 고유번호 목록을 만들어 서버에 함께 올린다(없으면 건너뜀).
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 server/news-proxy/build-dart-corps.py || echo "DART 회사 목록을 만들지 않았습니다."
      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/news-proxy
          secrets: |
            APP_TOKEN
            NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET
            GOOGLE_API_KEY
            GDRIVE_FOLDER_ID
            FISIS_API_KEY
            DART_API_KEY
            APPS_SCRIPT_URL
            APPS_SCRIPT_SECRET
            ECOS_API_KEY
        env:
          APP_TOKEN: ${{ secrets.NEWS_PROXY_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FISIS_API_KEY: ${{ secrets.FISIS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      - name: Show URL
        run: echo "NEWS_PROXY_URL = ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
