name: Deploy news proxy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FISIS data
        # 권역별 금융회사·총자산 순위·통계표 위치를 FISIS에서 미리 받아 서버에 함께 올린다(Worker는 한 번에 하위 요청 50건 제한이 있다).
        env:
          FISIS_API_KEY: ${{ secrets.FISIS_API_KEY }}
        run: node server/news-proxy/build-fisis-data.mjs || echo "FISIS 자료를 만들지 않았습니다."
      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/news-proxy
          secrets: |
            APP_TOKEN
            NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET
            GOOGLE_API_KEY
            GDRIVE_FOLDER_ID
            FISIS_API_KEY
            LAW_OC
            ECOS_API_KEY
        env:
          APP_TOKEN: ${{ secrets.NEWS_PROXY_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FISIS_API_KEY: ${{ secrets.FISIS_API_KEY }}
          LAW_OC: ${{ secrets.LAW_OC }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      - name: Show URL
        run: echo "NEWS_PROXY_URL = ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
