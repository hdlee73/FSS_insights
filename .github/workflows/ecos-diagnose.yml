name: ECOS diagnose (temporary)
on:
  push:
    branches: [claude/project-thread-169eyo]
    paths: [.github/workflows/ecos-diagnose.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Query ECOS
        env:
          K: ${{ secrets.ECOS_API_KEY }}
        run: |
          B="https://ecos.bok.or.kr/api"
          for t in 151Y003 151Y002 151Y001 817Y002 901Y054 121Y006 721Y001 104Y016 151Y005; do
            echo "=== $t"
            curl -s "$B/StatisticItemList/$K/json/kr/1/500/$t" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('StatisticItemList',{}).get('row',[]):
              print(r['ITEM_CODE'],r['ITEM_NAME'],r.get('CYCLE'),r.get('START_TIME'),r.get('END_TIME'),r.get('UNIT_NAME'))
          print(d.get('RESULT'))
          "
          done
