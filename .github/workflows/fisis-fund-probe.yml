name: FISIS fund probe (temporary)
on:
  pull_request:
    paths:
      - "server/fund-data/probe_fisis_fund.mjs"
      - ".github/workflows/fisis-fund-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          FISIS_API_KEY: ${{ secrets.FISIS_API_KEY }}
        run: node server/fund-data/probe_fisis_fund.mjs
