name: Fund AUM screenshot
on:
  push:
    branches: [claude/fund-aum-shot]
    paths-ignore: [".github/workflows/freesis-probe.yml"]
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.hdlee73.financenewsradar.ui.FundAumShotTest
            adb logcat -d -s FUNDSHOT:I > fundshot.log || true
      - name: Rebuild PNG files
        if: always()
        run: |
          python3 - <<'PY'
          import base64, re, collections
          parts = collections.defaultdict(dict)
          for line in open("fundshot.log", errors="replace"):
              m = re.search(r"FUNDSHOT: (\w+)\|(\w+)\|(\S+)", line)
              if m and m.group(2).isdigit(): parts[m.group(1)][int(m.group(2))] = m.group(3)
          import os; os.makedirs("shots", exist_ok=True)
          for name, d in parts.items():
              b = "".join(d[i] for i in sorted(d))
              open(f"shots/{name}.png", "wb").write(base64.b64decode(b))
              print("PNG", name, len(b))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fund-aum-shots
          path: |
            shots/
            fundshot.log
