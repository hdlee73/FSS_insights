name = "news-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# 게시판 저장소. 처음 배포할 때 Cloudflare가 자동으로 만들어 연결한다(wrangler 4.45 이상).
[[d1_databases]]
binding = "DB"
database_name = "inspector-tips"

# 게시판 첨부 파일(이미지·문서). 대시보드에서 R2를 한 번 활성화해야 한다.
[[r2_buckets]]
binding = "FILES"
bucket_name = "inspector-tips-files"
